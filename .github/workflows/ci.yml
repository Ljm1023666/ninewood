name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client-react run lint
      - run: pnpm --filter server run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ninewood
          POSTGRES_PASSWORD: ninewood_test
          POSTGRES_DB: ninewood_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Prisma migrations
        run: pnpm --filter server exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
      - name: Unit + trust integration tests
        run: pnpm --filter server run test
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
          CI: 'true'
          RUN_PG_TRUST_TESTS: '1'
      - run: pnpm --filter client-react run test

  path-pool-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ninewood
          POSTGRES_PASSWORD: ninewood_test
          POSTGRES_DB: ninewood_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server exec prisma db push
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
      - run: pnpm --filter server run db:seed
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
      - run: pnpm --filter server run seed:coverage-gaps
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
      - run: pnpm --filter server run test:path-coverage
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test
      - run: pnpm --filter server run audit:demand-paths
        env:
          DATABASE_URL: postgresql://ninewood:ninewood_test@localhost:5432/ninewood_test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter client-react run build
      - run: pnpm --filter server run build
