<!DOCTYPE html>

        body {
            background-color: #0A0A0A;
        }

<body class="font-body-md text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- TopNavBar -->
<nav class="fixed top-0 left-1/2 -translate-x-1/2 z-50 flex items-center gap-xl px-lg py-sm bg-white/5 dark:bg-white/3 font-body-md text-body-md rounded-full mt-6 mx-auto w-fit backdrop-blur-xl border border-white/10 shadow-xl">
<div class="font-headline-md text-headline-md text-primary font-bold">· · ·</div>
<div class="hidden md:flex items-center gap-lg">
<a class="text-on-surface-variant hover:text-on-surface transition-colors hover:bg-white/10 transition-all duration-300 px-md py-sm rounded-full active:scale-95 transition-transform" href="#">首页</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors hover:bg-white/10 transition-all duration-300 px-md py-sm rounded-full active:scale-95 transition-transform" href="#">发现</a>
<a class="text-on-surface-variant hover:text-on-surface transition-colors hover:bg-white/10 transition-all duration-300 px-md py-sm rounded-full active:scale-95 transition-transform" href="#">圈子</a>
</div>
<div class="flex items-center gap-sm">
<button class="text-primary font-bold border-b-2 border-primary pb-1 px-md py-sm active:scale-95 transition-transform">登录</button>
<button class="text-on-surface-variant hover:text-on-surface transition-colors hover:bg-white/10 transition-all duration-300 px-md py-sm rounded-full active:scale-95 transition-transform">注册</button>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="w-full max-w-[420px] mx-auto z-10 px-md pt-32 pb-24 flex flex-col items-center justify-center min-h-screen">
<!-- Login Card -->
<div class="w-full bg-white/[0.03] backdrop-blur-[12px] border border-white/[0.08] rounded-xl p-8 sm:p-12 shadow-[0_20px_40px_rgba(0,0,0,0.5)] border-t-white/[0.15]">
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">欢迎回来</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">使用密码登录</p>
</div>
<!-- Third Party Login -->
<button class="w-full flex items-center justify-center gap-sm py-3 px-4 rounded-full border border-white/[0.05] bg-white/[0.02] text-on-surface-variant/50 font-label-md text-label-md cursor-not-allowed mb-6">
<span class="material-symbols-outlined text-lg opacity-50">account_circle</span>
                Google 登录（即将推出）
            </button>
<!-- Divider -->
<div class="flex items-center gap-4 mb-6">
<div class="flex-1 h-px bg-white/[0.08]"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">or</span>
<div class="flex-1 h-px bg-white/[0.08]"></div>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Phone Input -->
<div class="relative flex items-center">
<span class="absolute left-4 font-body-sm text-body-sm text-on-surface-variant">+86</span>
<input class="w-full bg-white/[0.05] border border-white/[0.08] focus:border-[#3388FF] focus:bg-white/[0.02] rounded-full py-3 pl-14 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-[#444444] outline-none transition-all duration-300" placeholder="手机号" type="tel"/>
</div>
<!-- Password Input -->
<div class="relative flex items-center">
<input class="w-full bg-white/[0.05] border border-white/[0.08] focus:border-[#3388FF] focus:bg-white/[0.02] rounded-full py-3 pl-4 pr-12 font-body-sm text-body-sm text-on-surface placeholder:text-[#444444] outline-none transition-all duration-300" placeholder="密码" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-on-surface transition-colors flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Options -->
<div class="flex items-center justify-between mt-2">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="w-4 h-4 rounded-[4px] border border-white/[0.2] group-hover:border-[#3388FF] flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[12px] opacity-0 text-white">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant group-hover:text-on-surface transition-colors">记住我</span>
<!-- Hidden actual checkbox for functionality if needed later, but styling custom -->
<input class="hidden" type="checkbox"/>
</label>
<a class="font-label-sm text-label-sm text-[#3388FF] hover:text-[#5c9dff] transition-colors" href="#">忘记密码？</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#3388FF] hover:bg-[#4d97ff] text-white font-label-md text-label-md rounded-full py-3.5 mt-2 transition-colors active:scale-[0.98]" type="submit">
                    登录
                </button>
</form>
<div class="mt-6 text-center">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors" href="#">手机号注册</a>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full py-xl flex flex-col items-center gap-xs bg-transparent z-10">
<div class="flex items-center gap-6 mb-2">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">隐私政策</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">服务条款</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">关于我们</a>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/50">© 2024 High-Performance Studio. All rights reserved.</p>
</footer>
</body></html>
