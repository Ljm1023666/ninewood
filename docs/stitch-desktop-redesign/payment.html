<!DOCTYPE html>

<html class="dark" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ninewood - Payment Confirmation</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;700;900&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container": "#231f17",
                        "tertiary-container": "#97b0ff",
                        "surface-glass": "rgba(16, 20, 31, 0.6)",
                        "surface-container-low": "#1f1b13",
                        "surface-variant": "#38342b",
                        "primary-fixed-dim": "#e9c349",
                        "on-secondary-fixed-variant": "#4f4628",
                        "on-tertiary-fixed-variant": "#27438a",
                        "on-tertiary-fixed": "#00174b",
                        "background-deep": "#0A0E17",
                        "primary": "#f2ca50",
                        "inverse-primary": "#735c00",
                        "outline": "#99907c",
                        "accent-success": "#10B981",
                        "tertiary": "#bfcdff",
                        "on-secondary": "#383013",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "tertiary-fixed": "#dbe1ff",
                        "on-tertiary-container": "#254188",
                        "on-primary-container": "#554300",
                        "surface-tint": "#e9c349",
                        "secondary-fixed-dim": "#d3c69e",
                        "on-surface": "#eae1d4",
                        "inverse-on-surface": "#343027",
                        "background": "#16130b",
                        "on-primary-fixed-variant": "#574500",
                        "surface-container-high": "#2d2a21",
                        "on-secondary-fixed": "#221b03",
                        "outline-variant": "#4d4635",
                        "surface": "#16130b",
                        "secondary-fixed": "#f0e2b8",
                        "secondary": "#d3c69e",
                        "on-surface-variant": "#d0c5af",
                        "error": "#ffb4ab",
                        "surface-container-lowest": "#110e07",
                        "primary-fixed": "#ffe088",
                        "inverse-surface": "#eae1d4",
                        "primary-container": "#d4af37",
                        "surface-dim": "#16130b",
                        "surface-bright": "#3d392f",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "on-tertiary": "#082b72",
                        "on-secondary-container": "#c4b891",
                        "on-primary-fixed": "#241a00",
                        "border-gold": "rgba(212, 175, 55, 0.15)",
                        "secondary-container": "#51492a",
                        "on-error-container": "#ffdad6",
                        "gold-bright": "#F4D03F",
                        "surface-container-highest": "#38342b",
                        "accent-error": "#F87171",
                        "on-primary": "#3c2f00",
                        "on-background": "#eae1d4",
                        "border-white": "rgba(255, 255, 255, 0.05)"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "sidebar-width": "280px",
                        "gutter": "24px",
                        "stack-md": "16px",
                        "margin-page": "48px",
                        "stack-lg": "32px",
                        "container-max": "1100px"
                    },
                    fontFamily: {
                        "headline-lg-mobile": ["Playfair Display"],
                        "label-caps": ["Geist"],
                        "title-md": ["Geist"],
                        "headline-lg": ["Playfair Display"],
                        "data-mono": ["Geist"],
                        "display-xl": ["Playfair Display"],
                        "body-md": ["Geist"]
                    },
                    fontSize: {
                        "headline-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
                        "label-caps": ["10px", { lineHeight: "1", letterSpacing: "0.3em", fontWeight: "900" }],
                        "title-md": ["18px", { lineHeight: "1.4", fontWeight: "700" }],
                        "headline-lg": ["48px", { lineHeight: "1.2", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "data-mono": ["18px", { lineHeight: "1", letterSpacing: "-0.01em", fontWeight: "700" }],
                        "display-xl": ["84px", { lineHeight: "1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["14px", { lineHeight: "1.6", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0A0E17;
            background-image: radial-gradient(circle at top left, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                              radial-gradient(circle at bottom right, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
            min-height: 100vh;
        }
        .glass-card {
            background-color: rgba(16, 20, 31, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
    </style>
</head>
<body class="text-on-surface antialiased flex items-center justify-center">
<!-- TopNavBar (Nav Shell Suppressed for Transactional Intent, but brand logo included for context) -->
<header class="fixed top-0 left-0 w-full h-20 flex justify-between items-center px-gutter max-w-container-max mx-auto border-b border-border-white bg-surface-glass backdrop-blur-2xl z-50">
<div class="font-headline-lg text-headline-lg text-primary tracking-tight">Ninewood</div>
<div class="flex items-center space-x-6 text-on-surface-variant font-title-md text-title-md">
<span>结算中心</span>
</div>
</header>
<!-- Main Payment Canvas -->
<main class="w-full max-w-container-max px-gutter mx-auto pt-32 pb-margin-page">
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter h-full min-h-[600px]">
<!-- LEFT SECTION: Order Summary -->
<div class="md:col-span-6 flex flex-col justify-center">
<div class="glass-card rounded-xl border border-white p-8 lg:p-12 h-full flex flex-col justify-between relative overflow-hidden group">
<!-- Subtle watermark icon -->
<span class="material-symbols-outlined absolute -right-8 -bottom-8 text-[200px] text-white/5 pointer-events-none transition-transform duration-700 group-hover:scale-110">receipt_long</span>
<div>
<div class="font-label-caps text-label-caps text-primary tracking-widest uppercase mb-stack-md">订单详情</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-lg relative inline-block">
                            高级架构咨询服务
                            <div class="absolute -bottom-2 left-0 w-12 h-1 bg-primary"></div>
</h1>
<div class="space-y-6 mt-12 font-body-md text-body-md">
<div class="flex justify-between items-center border-b border-white/5 pb-4">
<span class="text-on-surface-variant">成交金额</span>
<span class="font-data-mono text-data-mono text-on-surface">¥200</span>
</div>
<div class="flex justify-between items-center border-b border-white/5 pb-4">
<span class="text-on-surface-variant">平台服务费 (5%)</span>
<span class="font-data-mono text-data-mono text-on-surface">¥10</span>
</div>
</div>
</div>
<div class="mt-12 pt-6 border-t border-border-gold flex justify-between items-end">
<span class="font-title-md text-title-md text-on-surface-variant">实付金额</span>
<span class="font-display-xl text-headline-lg text-primary">¥210</span>
</div>
</div>
</div>
<!-- RIGHT SECTION: Payment Action Area -->
<div class="md:col-span-6 flex flex-col justify-center">
<div class="glass-card rounded-xl border border-gold shadow-[0_20px_40px_-10px_rgba(0,0,0,0.5)] p-8 lg:p-12 h-full flex flex-col items-center justify-center text-center">
<div class="mb-stack-lg">
<span class="material-symbols-outlined text-primary text-6xl mb-4" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<div class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase mb-2">支付总额</div>
<div class="font-display-xl text-display-xl text-on-surface mb-2 tracking-tighter">
                            210 <span class="font-headline-lg text-headline-lg text-primary ml-2">点</span>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">开发期点数支付</p>
</div>
<div class="w-full max-w-md space-y-stack-md mt-8">
<button class="w-full bg-gradient-to-r from-primary-container to-gold-bright text-on-primary font-title-md text-title-md py-4 rounded-full shadow-[0_0_20px_rgba(212,175,55,0.2)] hover:shadow-[0_0_30px_rgba(212,175,55,0.4)] transition-all duration-300 transform hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center space-x-2">
<span>确认支付</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
<button class="w-full bg-transparent border border-primary text-on-surface font-title-md text-title-md py-4 rounded-full hover:bg-white/5 transition-colors duration-300">
                            取消
                        </button>
</div>
<div class="mt-8 flex items-center space-x-2 text-on-surface-variant/50 font-body-md text-body-md">
<span class="material-symbols-outlined text-sm">lock</span>
<span>端到端加密传输，保障您的资金安全</span>
</div>
</div>
</div>
</div>
</main>
</body></html>
