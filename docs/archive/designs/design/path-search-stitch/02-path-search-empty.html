<style>
        body { background-color: #121212; color: #e5e2e1; font-family: 'Geist', sans-serif; }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-panel:hover {
            border-color: rgba(171, 199, 255, 0.25);
            box-shadow: 0 0 15px -5px #abc7ff;
        }
        .input-glass {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e2e1;
        }
        .input-glass:focus {
            outline: none;
            border-bottom: 2px solid #abc7ff;
            box-shadow: none;
        }
    </style>
</head>
<body class="bg-[#121212] min-h-screen flex overflow-hidden">
<!-- SideNavBar -->
<nav class="w-panel-width-side h-screen fixed left-0 top-0 bg-[#0A0A0A] border-r border-white/10 flex flex-col py-margin-page z-50">
<div class="px-gutter mb-8">
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Ninewood</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1">Command Center</p>
</div>
<div class="flex-1 flex flex-col gap-2">
<a class="flex items-center gap-3 px-gutter py-3 text-on-surface-variant opacity-70 hover:opacity-100 hover:bg-white/5 transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="search_insights">search_insights</span>
<span class="font-body-md text-body-md">Discover</span>
</a>
<a class="flex items-center gap-3 px-gutter py-3 text-on-surface-variant opacity-70 hover:opacity-100 hover:bg-white/5 transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="publish">publish</span>
<span class="font-body-md text-body-md">Publish</span>
</a>
<a class="flex items-center gap-3 px-gutter py-3 border-l-2 border-primary bg-gradient-to-r from-primary/10 to-transparent text-primary font-bold" href="#">
<span class="material-symbols-outlined" data-icon="account_tree">account_tree</span>
<span class="font-body-md text-body-md">Path Search</span>
</a>
</div>
</nav>
<!-- Main Content Area -->
<div class="flex-1 flex flex-col ml-panel-width-side h-screen overflow-y-auto">
<!-- TopAppBar -->
<header class="bg-white/3 backdrop-blur-xl border-b border-white/10 docked full-width top-0 sticky z-40">
<div class="flex justify-between items-center h-16 px-gutter w-full">
<div class="font-title-sm text-title-sm text-primary"></div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-all">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-all">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-white/10">
<img class="w-full h-full object-cover" data-alt="A futuristic avatar of a user in a high-tech command center, dark glassmorphism aesthetic with subtle blue lighting, detailed face, 4k resolution, professional mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC7qidll9t_hVJ598o4D1Yuc7F9VRBJz9h7bnFWijXTR5S_4z1ZVvVuOtwwOlA_5ats0jFSTNzWtpOiCD5N1SxhITg-cQSfTWmBQRKXofv3NDitagz-Vq7IsvVr1ZwAldPGU75fNso-ZRsVSjSLTSP2NcgyuceU1U9nrxnOY_bd9Tkx-jdT_79mFad13mSO9dd7zMGWb49crx-MJlElIAFBbEQDW0mtkh78EbQDD961XdvlOd6Oo6JgRNzcBT0vYpHuK3lWw2-wmiE"/>
</div>
</div>
</div>
</header>
<!-- Page Content -->
<main class="flex-1 p-margin-page flex flex-col gap-gutter max-w-[1440px] mx-auto w-full">
<!-- Header -->
<div class="mb-4">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">路径检索</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-2xl">构建并分析复杂的物流追踪路径，发掘潜在的数据关联与流转瓶颈。</p>
</div>
<!-- Search Configuration Panel -->
<div class="glass-panel rounded-xl p-6 transition-all duration-300">
<h3 class="font-title-sm text-title-sm text-on-surface mb-6 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[20px]">manage_search</span>
                    检索路径
                </h3>
<div class="flex flex-wrap items-end gap-4">
<div class="flex-1 min-w-[200px]">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2">类型</label>
<select class="input-glass w-full py-2 font-body-md text-body-md bg-surface">
<option value="tag">TAG</option>
<option value="attr">ATTR</option>
<option value="bkt">BKT</option>
</select>
</div>
<div class="flex-[2] min-w-[300px]">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2">输入值</label>
<input class="input-glass w-full py-2 font-body-md text-body-md" placeholder="添加路径后开始检索..." type="text"/>
</div>
<button class="bg-primary text-on-primary font-title-sm text-title-sm px-6 py-2 rounded-lg hover:bg-primary-fixed-dim transition-colors h-[42px]">
                        + 添加路径
                    </button>
</div>
</div>
<!-- Empty State Area -->
<div class="flex-1 flex flex-col items-center justify-center mt-12 glass-panel rounded-xl p-12 border-dashed">
<span class="material-symbols-outlined text-on-surface-variant opacity-20 text-[120px] mb-6" data-icon="route">route</span>
<h4 class="font-headline-md text-headline-md text-on-surface mb-3">从上方添加路径开始检索</h4>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-md">
                    选择类型并输入值，系统将根据您提供的条件进行精准匹配。可组合最多 8 条路径。
                </p>
</div>
</main>
</div>
</body></html>
